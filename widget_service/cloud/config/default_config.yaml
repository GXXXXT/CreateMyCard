# 蓝区默认配置。绿区 spec 配置存在时，只读取 spec，不与本文件合并。
ENVIRONMENT: local

hag_slb_url: ""
osms_prepare_url: ""
osms_complete_url: ""
osms_query_url: ""
osms_delete_url: ""
hag_osms_ak: ""
ids_query_url: "http://{{ip}}:{{port}}/hiai/ids/databus/v1/kvcommondata/query"
ids_access_key: "23232323232"
sts_serverDomain: ""
obs.use.edge: false
obs.expire.time: 3600
# 模型使用原始 src；转换成标准 A2UI 后按本映射替换，未命中保留原路径。
asset.src.url.mapping: ""

# 本地服务监听地址；0.0.0.0 表示监听所有网卡，局域网内可通过本机 IP（如 192.168.3.53:8855）访问。
server_host: 0.0.0.0
server_port: 8855

# 产物 mock 访问地址前缀；本地联调时指向本服务下载接口，host 需与端侧访问的地址保持一致
# （端侧 WebSocket 用 ws://192.168.3.53:8855 时，此处应为 http://192.168.3.53:8855/api/v1/widget/artifact）。
artifact_base_url: "http://192.168.3.53:8855/api/v1/widget/artifact"

enable_artifact_validation: true
enable_a2ui_model_mock: false
enable_ids_mock: true
ai_widget_data_huashan_enable: false
enable_default_capability_registry_fallback: true
enable_default_protocol_profile_fallback: true
enable_validation_failure_retry: false
enable_widget_edit: false
enable_artifact_download_mock: true
enable_widget_directive_commands: false
enable_compact_dsl_argument_repair_fallback: false
compact_dsl_argument_repair_reminder_count: 1
compact_dsl_argument_repair_max_attempts: 2
# 参数兜底、归一化及请求校验完成后，仅对 Compact DSL 生成流程进行接口级重试。
enable_compact_dsl_interface_retry: false
# 首次生成之外的额外重试次数；0 不重试，1 表示最多执行两次生成。必须为非负整数。
compact_dsl_interface_retry_count: 1
enable_openai_fallback: true
enable_sensitive_log_fields: true
enable_card_template: false
enable_jsx_generation: false
fusion_ball_min_prd_version: 11.7.5.206

model_appid: ""
model_url: ""
model_bid: ""
model_flow_id: ""
system.prompt: "@file:../data/protocol_profiles/design-compact-dsl/PROMPT.md"
edit.system.prompt: "@file:../data/protocol_profiles/design-compact-dsl/EDIT_SYSTEM_PROMPT.md"
repair.system.prompt: "@file:../data/protocol_profiles/design-compact-dsl/REPAIR_SYSTEM_PROMPT.md"

a2ui_form_model_backend: openai
design_compact_model_backend: openai
validation_failure_max_repair_attempts: 1
model_max_concurrency: 20
model_queue_timeout_seconds: 120
model_request_timeout_seconds: 120
model_prompt_log_preview_chars: 30

openai_master_client: deepseek_api
openai_fallback_client: llmclient
deepseek_platform_access_key: ""
deepseek_platform_secret_key_sts_config_key: genui.deepseek.platform.secret.key
deepseek_platform_ws_url: ""
deepseek_platform_api_key: AccessService
deepseek_platform_sender: superagent
deepseek_platform_model_select: false
deepseek_platform_thinking_model_name: AGENT-DEEPSEEK-V4-FLASH
deepseek_platform_model_name: AGENT-DEEPSEEK-V4-FLASH

enable_model_failure_retry: false
model_failure_max_retry_attempts: 1
fallback_model_failure_max_retry_attempts: 1
model_failure_retry_initial_delay_seconds: 1.0
model_failure_retry_max_delay_seconds: 30.0
model_failure_retry_backoff_multiplier: 2.0
model_failure_retry_jitter_ratio: 0.2

deepseek_ws_url: ""
deepseek_model: deepseek-ai/DeepSeek-V4-Flash
deepseek_api_key: AccessService
deepseek_user: genui_user
deepseek_request_id: genui_ui
deepseek_temperature: 0.7
deepseek_top_p: 0.9
deepseek_top_k: 1
deepseek_max_tokens: 128000
deepseek_enable_thinking: false
deepseek_include_usage: true
deepseek_debug_usage: true
deepseek_recv_timeout: 120

# DeepSeek OpenAI 兼容 API（供应商提供，本地直连）。
# 使用前请填写下面两项：
#   deepseek_api_base_url  供应商提供的接口地址（无需拼接 /chat/completions），例如 https://api.deepseek.com
#   deepseek_api_auth_key  供应商提供的 API Key；优先从环境变量 DEEPSEEK_API_AUTH_KEY 读取，留空时模型调用会明确报错
# 注意：deepseek_api_key 是 llmclient 内部网关的业务标识，勿与本项混淆。
deepseek_api_base_url: "https://st8tp3ajl0df3n8b8l8qu.apigateway-cn-beijing.volceapi.com/v1"
deepseek_api_auth_key: ""
deepseek_api_model: deepseek-4.1-flash
# 单次输出 token 上限；0 表示不传该参数，使用 DeepSeek 服务端默认值。
deepseek_api_max_tokens: 8192
